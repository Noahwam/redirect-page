<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リンク選択ページ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 80px;
      background-color: #f9f9f9;
    }
    .link-button {
      display: block;
      margin: 30px auto;
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      text-decoration: none;
      background-color: #222;
      color: #fff;
      border-radius: 10px;
      width: 300px;
    }
    .notice {
      font-size: 20px;
      color: #555;
      margin-top: 80px;
      margin-bottom: 10px;
    }
  </style>

  <script>
    window.onload = function () {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (ua.includes("TikTok")) {
        // TikTokアプリ内で開かれたらWeb版プロフィールに強制移動
        window.location.href = "https://www.tiktok.com/@noah.wam3";
      }
    };
  </script>
</head>

<body>

  <!-- 🔶 Candfansボタン -->
  <a class="link-button" href="https://candfans.com/noahwam" target="_blank">
    [ 🔥 ファンクラブに行く ]  👆今すぐ見たいひとcandfans
  </a>

  <!-- 🔻 Xへの誘導文とボタン -->
  <p class="notice">Xを見たい人は、下のリンクを押してからタップしてね👇</p>
  <a class="link-button" href="twitter://user?screen_name=noah_wam5">
    [ 🐦 X（旧Twitter）を見る ]　👆Myファンズはこっちから
  </a>

</body>
</html>
